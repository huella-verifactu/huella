name: Bug report
description: Something produces a wrong result or fails.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Do not file it here. Use the Security tab → *Report a vulnerability* (see SECURITY.md).
        Never paste real certificates, keys or taxpayer data. Use the AEAT example NIF `89890001K`.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code or input that shows the problem.
      render: python
  - type: textarea
    id: aeat
    attributes:
      label: AEAT response or error code (if any)
      description: Anonymise NIFs, names and CSV codes first.
      render: xml
